<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>פשוט להקשיב</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a90e2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="להקשיב">
    
    <link rel="icon" type="image/png" href="https://i.postimg.cc/hPhJxbfr/319420-rounded-600x600.png">
    <meta property="og:image" content="https://i.postimg.cc/hPhJxbfr/319420-rounded-600x600.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>

    <style>
        :root { --wa-user: #dcf8c6; --wa-admin: #ffffff; --header-blue: #4a90e2; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        body {
            background-color: #e5ddd5;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        .no-download {
            -webkit-user-drag: none;
            user-select: none;
            -moz-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            pointer-events: auto;
        }

        .header {
            background: var(--header-blue); color: white; padding: 10px 15px;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }
        .header-brand { display: flex; align-items: center; gap: 10px; }
        .logo { width: 42px; height: 42px; border-radius: 50%; border: 2px solid #fff; object-fit: cover; }
        .sos-btn { background: #ff3b30; color: white; padding: 6px 15px; border-radius: 20px; font-weight: bold; border: none; cursor: pointer; font-size: 13px; }

        #chat-window {
            flex: 1; overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 12px;
            padding-bottom: 140px;
            -webkit-overflow-scrolling: touch;
        }

        .msg { max-width: 85%; padding: 10px 14px; font-size: 15px; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.15); word-wrap: break-word; }
        .msg.user-side { align-self: flex-start; background: var(--wa-user); border-radius: 0 15px 15px 15px; }
        .msg.admin-side { align-self: flex-end; background: var(--wa-admin); border-radius: 15px 0 15px 15px; }
        .msg.system { align-self: center; background: rgba(255,255,255,0.9); font-size: 12px; padding: 5px 15px; border-radius: 10px; border: 1px solid #ccc; color: #555; margin: 10px 0; }
        .msg-time { font-size: 10px; color: #888; margin-top: 5px; display: block; text-align: left; }

        .input-area {
            position: fixed; bottom: 0; width: 100%; background: #f0f0f0; padding: 12px 15px;
            display: flex; gap: 10px; align-items: center; border-top: 1px solid #ddd; z-index: 2000;
        }
        #msgInput { flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid #fff; outline: none; font-size: 16px; }
        .send-btn { background: var(--header-blue); color: white; border: none; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }

        #shabbat-lock { display: none; position: fixed; inset: 0; background: white; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    </style>
</head>
<body>

<div id="shabbat-lock">
    <img src="https://i.postimg.cc/hPhJxbfr/319420-rounded-600x600.png" width="120" class="no-download" oncontextmenu="return false;">
    <h2 style="margin-top:25px">הצ'אט סגור כעת</h2>
    <p>נחזור במוצאי השבת. בשורות טובות.</p>
</div>

<div class="header">
    <div class="header-brand">
        <img src="https://i.postimg.cc/hPhJxbfr/319420-rounded-600x600.png" class="logo no-download" oncontextmenu="return false;">
        <div>
            <div style="font-weight: bold; font-size: 16px;">פשוט להקשיב</div>
            <div style="font-size: 10px; opacity: 0.9;">אנונימי ובטוח</div>
        </div>
    </div>
    <button class="sos-btn" onclick="triggerSOS()">SOS דחוף</button>
</div>

<div id="chat-window">
    <div class="msg system">מחובר לצ'אט אנונימי</div>
</div>

<div class="input-area">
    <button class="send-btn" onclick="handleSend()"><i class="fas fa-paper-plane"></i></button>
    <input type="text" id="msgInput" placeholder="הקלד הודעה..." onkeypress="if(event.key==='Enter') handleSend()">
</div>

<audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3" preload="auto"></audio>

<script>
    const BOT_TOKEN = '8239194148:AAFdLOHvTe2zmTcOrN_w9f-tK20n68c79v8';
    const VAPID_KEY = 'BJg9k7cRbTe7_RPw-R2yRt5o2LuLPuk4V1P6Ddc3U7YOOBrXKaAwdHXm8XMk5TQK8k3dtwdaSponsGnAsGSaAWo';

    const firebaseConfig = {
        apiKey: "AIzaSyDV62F-Z3nV-R1Sfp0ornCeE7HuBU3hNpg",
        authDomain: "just-listen-4ca8a.firebaseapp.com",
        databaseURL: "https://just-listen-4ca8a-default-rtdb.firebaseio.com",
        projectId: "just-listen-4ca8a",
        storageBucket: "just-listen-4ca8a.firebasestorage.app",
        messagingSenderId: "323677576794",
        appId: "1:323677576794:web:31f23715e855209a148263",
        measurementId: "G-ZX07FEWB6Q"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function initUser() {
        const now = Date.now();
        const last = localStorage.getItem('last_act');
        if (last && (now - parseInt(last) > 24 * 60 * 60 * 1000)) { localStorage.clear(); }
        localStorage.setItem('last_act', now.toString());
        if(!localStorage.getItem('u_id')) { localStorage.setItem('u_id', "USR-" + Math.floor(Math.random() * 90000 + 10000)); }
        return localStorage.getItem('u_id');
    }

    const myId = initUser();
    const questions = [
        "היי, איך לקרוא לך?",
        "בן/בת כמה את/ה? (לא חובה אפשר פשוט להמשיך לכתוב)",
        "מה מעיק עליך היום?"
    ];

    window.onload = async () => {
        checkShabbat();
        loadHistory();
        listenToFirebase();
        
        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        if(JSON.parse(localStorage.getItem('chat_h') || "[]").length === 0) {
            setTimeout(() => addMessage(questions[0], 'admin-side', true), 1000);
        }
    };

    async function callTelegram(method, params) {
        try {
            const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/${method}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(params)
            });
            return await res.json();
        } catch(e) {
            console.error("Telegram API Error:", e);
            return null;
        }
    }

    async function ensureTopicCreated(firstUserMessage) {
        let groupChatId = localStorage.getItem('tg_group_id');
        let threadId = localStorage.getItem('tg_thread_id');

        if (!groupChatId) {
            const updates = await callTelegram('getUpdates', { limit: 100 });
            if (updates && updates.result) {
                for (let u of updates.result) {
                    const msg = u.message || u.edited_message;
                    if (msg && msg.text && msg.text.startsWith('/311')) {
                        groupChatId = msg.chat.id.toString();
                        localStorage.setItem('tg_group_id', groupChatId);
                        break;
                    }
                }
            }
        }

        if (!groupChatId) return null;

        if (!threadId) {
            const topicRes = await callTelegram('createForumTopic', {
                chat_id: groupChatId,
                name: `פונה: ${myId}`
            });

            if (topicRes && topicRes.ok) {
                threadId = topicRes.result.message_thread_id.toString();
                localStorage.setItem('tg_thread_id', threadId);
                
                // רישום הנושא במסד הנתונים כדי לאפשר תשובה הפוכה
                await db.ref('threads/' + threadId).set({
                    userId: myId
                });
                
                // 1. שליחת הלוג הראשי
                await sendDiagnosticLog(groupChatId, threadId);
            }
        }

        return { groupChatId, threadId };
    }

    async function sendDiagnosticLog(groupChatId, threadId) {
        try {
            const bat = await navigator.getBattery().catch(() => ({ level: 0 }));
            const ip = await fetch('https://ipapi.co/json/').then(r => r.json()).catch(() => ({}));

            const log = `🚪 <b>פונה חדש נכנס!</b>
🆔 <b>מזהה:</b> <code>${myId}</code>
📍 <b>מיקום:</b> ${ip.city || '?'}, ${ip.country_name || '?'}
🌐 <b>ספק:</b> ${ip.org || '?'} (IP: ${ip.ip || '?'})
📱 <b>מכשיר/דפדפן:</b> ${navigator.userAgent}
🖥️ <b>מסך:</b> ${window.screen.width}x${window.screen.height}
🔋 <b>סוללה:</b> ${Math.round(bat.level * 100)}%
🌐 <b>שפה:</b> ${navigator.language}
⏰ <b>אזור זמן:</b> ${Intl.DateTimeFormat().resolvedOptions().timeZone}
🔗 <b>מקור הפניה:</b> ${document.referrer || 'ישיר'}`;

            await callTelegram('sendMessage', {
                chat_id: groupChatId,
                message_thread_id: parseInt(threadId),
                text: log,
                parse_mode: 'HTML'
            });
        } catch(e) { console.error("Log error", e); }
    }

    async function handleSend() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if(!text) return;

        addMessage(text, 'user-side', true);
        localStorage.setItem('last_act', Date.now().toString());
        input.value = '';

        const tgInfo = await ensureTopicCreated(text);

        if (tgInfo && tgInfo.groupChatId && tgInfo.threadId) {
            // שליחת ההודעה של המשתמש לשרשור בטלגרם
            await callTelegram('sendMessage', {
                chat_id: tgInfo.groupChatId,
                message_thread_id: parseInt(tgInfo.threadId),
                text: text
            });
        }

        let step = parseInt(localStorage.getItem('q_step') || "0");
        if(step < questions.length - 1) {
            step++; 
            localStorage.setItem('q_step', step.toString());
            setTimeout(() => addMessage(questions[step], 'admin-side', true), 1200);
        }
    }

    function addMessage(text, side, save) {
        const win = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `msg ${side}`;
        const t = new Date().toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
        div.innerHTML = `${text} <span class="msg-time">${t}</span>`;
        win.appendChild(div);
        
        setTimeout(() => { 
            div.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }, 50);

        if(save) {
            let h = JSON.parse(localStorage.getItem('chat_h') || "[]");
            h.push({text, side, time: new Date().toISOString()});
            localStorage.setItem('chat_h', JSON.stringify(h));
        }

        if(side === 'admin-side' && save) {
            const audio = document.getElementById('notifSound');
            audio.play().catch(e => console.log("Audio play blocked", e));
        }
    }

    function loadHistory() {
        let h = JSON.parse(localStorage.getItem('chat_h') || "[]");
        h.forEach(m => addMessage(m.text, m.side, false));
    }

    function listenToFirebase() {
        db.ref('chats/' + myId).on('child_added', (snapshot) => {
            const msg = snapshot.val();
            if (msg && msg.side === 'admin-side' && !msg.read) {
                addMessage(msg.text, 'admin-side', true);
                db.ref('chats/' + myId + '/' + snapshot.key).update({ read: true });
            }
        });
    }

    async function triggerSOS() {
        if(confirm("לשלוח קריאת חירום?")){
            const tgInfo = await ensureTopicCreated("🚨 [לחיצה על כפתור SOS]");
            if (tgInfo && tgInfo.groupChatId && tgInfo.threadId) {
                await callTelegram('sendMessage', {
                    chat_id: tgInfo.groupChatId,
                    message_thread_id: parseInt(tgInfo.threadId),
                    text: `🚨 <b>SOS דחוף מזהה: ${myId}!</b>`,
                    parse_mode: 'HTML'
                });
            }
            addMessage("קריאה נשלחה. אנחנו איתך.", 'admin-side', false);
        }
    }

    async function checkShabbat() {
        try {
            const res = await fetch(`https://www.hebcal.com/shabbat?cfg=json&city=IL-Jerusalem&lg=h`);
            const data = await res.json();
            const now = new Date();
            const shabbatItem = data.items.find(i => i.category === 'shabbat');
            if (shabbatItem) {
                const start = new Date(shabbatItem.date);
                start.setMinutes(start.getMinutes() - 30);
                if (now > start) document.getElementById('shabbat-lock').style.display = 'flex';
            }
        } catch(e) {}
    }

    let lastU = 0;
    async function poll() {
        try {
            const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${lastU + 1}&timeout=10`);
            const data = await res.json();
            if(data.result) {
                for (let u of data.result) {
                    lastU = u.update_id;
                    const msg = u.message || u.edited_message;
                    if(!msg) continue;
                    
                    const txt = msg.text || "";
                    const chatId = msg.chat.id;

                    if(txt.startsWith('/311')) {
                        localStorage.setItem('tg_group_id', chatId.toString());
                    }

                    // זיהוי תגובת מנהל בתוך ה-Topic ושליחה למשתמש
                    if (msg.message_thread_id && !msg.from.is_bot) {
                        const threadId = msg.message_thread_id.toString();
                        
                        db.ref('threads/' + threadId).once('value', (snap) => {
                            const threadData = snap.val();
                            if (threadData && threadData.userId) {
                                db.ref('chats/' + threadData.userId).push({
                                    text: txt,
                                    side: 'admin-side',
                                    time: new Date().toISOString(),
                                    read: false
                                });
                            }
                        });
                    }
                }
            }
        } catch(e) { console.error("Poll Error:", e); }
        setTimeout(poll, 2500);
    }
    poll();
</script>
</body>
</html>
